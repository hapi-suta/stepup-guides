# API gateway (nginx) for Project 9.
#
# The gateway is the single public front door. It gives you, in ONE place:
#   - a stable entry point that hides how many API instances run behind it,
#   - rate limiting (cost + abuse protection - critical for LLM endpoints),
#   - request-size limits (block giant uploads before they reach the app),
#   - a place to terminate TLS and add security headers.
# The API containers are not published directly; only this gateway is.

# Rate-limit zone: 5 requests/second per client IP, small burst allowed.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=5r/s;

upstream app_backend {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Reject bodies larger than 2MB before they touch the app.
    client_max_body_size 2m;

    # Health check bypasses the rate limit so monitors never get throttled.
    location = /health {
        proxy_pass http://app_backend;
    }

    location / {
        limit_req zone=api_rl burst=10 nodelay;
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
