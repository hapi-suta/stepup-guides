# Infrastructure spec for streaming-replication lab.
# Happy uses this to provision servers per student.

lab: postgres/streaming-replication
nodes: 2

node1:
  role: primary
  label: pg-primary
  os: debian-12
  plan: g6-nanode-1        # Linode nanode ($5/mo, 1 CPU, 1GB RAM, 25GB disk)
  region: us-east           # or nearest to student
  ports:
    - 22/tcp                # SSH
    - 5432/tcp              # PostgreSQL

node2:
  role: standby
  label: pg-standby
  os: debian-12
  plan: g6-nanode-1
  region: us-east
  ports:
    - 22/tcp
    - 5432/tcp

estimated_cost: $10/month
auto_destroy_hours: 72

postgres_version: "16"
