all:
  vars:
    ansible_user: ec2-user
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    pg_version: "17"
    pg_bin: "/usr/pgsql-17/bin"
    pg_data: "/var/lib/pgsql/17/data"
    pg_db: "quantdb"
  children:
    pg_primary:
      hosts:
        pg-primary:
          ansible_host: 172.31.19.86
          pg_role: primary
    pg_replica:
      hosts:
        pg-replica:
          ansible_host: 172.31.22.69
          pg_role: replica
    pg_container:
      hosts:
        pg-container:
          ansible_host: 34.235.89.112
    pg_ops:
      hosts:
        pg-ops:
          ansible_host: 172.31.26.19
    pg_servers:
      children:
        pg_primary:
        pg_replica:
    all_db:
      children:
        pg_servers:
        pg_container:
